[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-ai"
version = "0.1.0"
description = "A Magic: The Gathering rules engine and self-play agent."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

# Install with: pip install -e ".[dev]"
# On the DGX Spark install torch separately, see [tool.mtg-ai.notes] below.
[project.optional-dependencies]
train = [
    "wandb>=0.17",
]
spectator = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
include = ["MTG_bot*"]

[tool.pytest.ini_options]
testpaths = ["MTG_bot"]
python_files = ["test_*.py"]
# The engine has no global step cap once the stall detector is removed; never let a
# hung rules loop wedge CI.
timeout = 120

[tool.mtg-ai.notes]
# torch is deliberately NOT a declared dependency, because the correct wheel differs
# per machine and installing the wrong one fails silently into a CPU fallback.
#
#   DGX Spark (aarch64, CUDA 13, sm_121):
#       pip install torch --index-url https://download.pytorch.org/whl/cu130
#     or, preferred, use the NGC arm64 container: nvcr.io/nvidia/pytorch:<tag>-py3
#     Then VERIFY, do not assume:
#       python -c "import torch; print(torch.cuda.get_device_capability(), torch.cuda.get_arch_list())"
#     get_arch_list() must contain sm_120 or sm_121. If it only has compute_90 you are
#     on PTX JIT and every kernel's first launch stalls.
#
#   Windows dev box (Intel Arc):
#       pip install torch --index-url https://download.pytorch.org/whl/xpu
#
# See docs/HARDWARE_DGX_SPARK.md.
